  <style>

:#84909d;font-size:18px;line-height:1}.sidebar-spacer{flex:1}.sidebar-info{display:flex;align-items:center;gap:7px;color:#606976;font-weight:650;font-size:11px;margin:12px 10px}.status-dot{background:#45a77b;border-radius:50%;width:7px;height:7px;flex:none}.test-tag{font-weight:600;font-size:10px;color:#798291;background:#e9edf1;padding:3px 6px;border-radius:5px}.sidebar-description{color:#9097a2;font-size:11px;line-height:1.8;margin:0 10px 19px}.sidebar-footer{display:flex;align-items:center;gap:8px;border-top:1px solid #e5e7eb;padding:17px 9px 0;font-size:11px;color:#6e7782;font-weight:550}.sidebar-close,.mobile-overlay{display:none}.main-panel{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}.topbar{height:69px;min-height:69px;display:flex;justify-content:space-between;align-items:center;padding:0 27px;border-bottom:1px solid #f2f2f2}.header-left{display:flex;align-items:center;gap:10px}.header-title{font-size:17px;font-weight:720;letter-spacing:-.55px}.header-chevron{font-size:17px;color:#a1a5ac;margin-left:3px}.header-beta{border:1px solid #e7e9ed;color:#959aa4;font-size:10px;padding:4px 7px;border-radius:6px;font-weight:700;letter-spacing:.5px}.top-action{display:flex;gap:7px;align-items:center;padding:8px 10px;border:0;background:transparent;color:#767d86;font-size:12px;border-radius:9px}.top-action svg{width:18px;height:18px}.top-action:hover,.icon-button:hover{background:#f0f1f4}.icon-button{background:none;border:0;border-radius:9px;color:#717780;padding:7px;display:grid;place-items:center}.icon-button svg{width:21px;height:21px}.menu-toggle{display:none}.conversation{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-behavior:smooth}.welcome{max-width:790px;margin:auto;padding:clamp(40px,8vh,96px) 30px 45px;text-align:center}.welcome-logo{width:66px;height:66px;border-radius:23px;background:#263e68;color:white;font-size:34px;font-weight:800;display:grid;place-items:center;margin:0 auto 31px;position:relative;padding-right:2px;box-shadow:0 12px 27px #253e6b18}.welcome-orbit{position:absolute;width:8px;height:8px;background:#8fb9fc;border:2px solid #fff;border-radius:50%;right:0;top:5px}.welcome h1{font-size:clamp(23px,3vw,31px);letter-spacing:-1.15px;font-weight:760;margin:0 0 15px;color:#23262c}.welcome p{font-size:14px;line-height:1.85;color:#828a95;margin:0}.welcome-divider{display:flex;align-items:center;justify-content:center;gap:13px;color:#a6acb5;font-size:12px;margin:53px auto 17px}.welcome-divider:before,.welcome-divider:after{content:"";width:40px;height:1px;background:#e7e9ed}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;max-width:690px;margin:auto}.suggestion{border:1px solid #e8e9ec;border-radius:14px;background:#fff;text-align:left;padding:19px 19px;min-height:75px;line-height:1.5;font-size:13px;font-weight:600;color:#515963;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 2px 6px #1b263309}.suggestion:after{content:"↗";color:#acb1bb;font-size:17px;font-weight:450}.suggestion:hover{background:#f8fafc;border-color:#ced8e6;transform:translateY(-1px)}.message{padding:15px 28px}.message:first-of-type{margin-top:20px}.message-inner{max-width:770px;margin:auto}.message.user .message-inner{display:flex;justify-content:flex-end}.message.user .bubble{max-width:min(85%,600px);padding:12px 17px;border-radius:19px;background:#f2f3f5;color:#292d34;font-size:14px;white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.message.assistant .message-inner{padding:1px 4px}.bot-heading{display:flex;align-items:center;gap:9px;margin-bottom:13px;font-weight:680;font-size:12px;color:#394251}.bot-avatar{height:27px;width:27px;border-radius:9px;background:#263e68;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}.message.assistant .bubble{white-space:pre-wrap;line-height:1.9;font-size:14px;color:#333944;overflow-wrap:anywhere}.source{font-size:12px;color:#8a939f;margin-top:13px}.source:empty,.actions:empty{display:none}.source a{color:#526f9c;text-decoration:none;border-bottom:1px solid #bfcde2}.actions{margin-top:15px;display:flex;flex-wrap:wrap}.action-link,.action-disabled{padding:11px 15px;border-radius:11px;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.action-link{color:#2b2611;background:#fee500}.action-link:before{content:"●";font-size:14px}.action-link:hover{background:#f3dc00}.action-disabled{color:#858e99;background:#f3f5f7}.composer-wrap{background:linear-gradient(0deg,#fff 88%,#ffffffeb);padding:12px 28px 18px}.composer-inner{max-width:780px;margin:auto}.composer{border:1px solid #e2e4e8;border-radius:22px;min-height:105px;box-shadow:0 3px 22px #232d3d0d;display:flex;flex-direction:column;background:white;transition:border .15s,box-shadow .15s}.composer:focus-within{border-color:#b7c4d6;box-shadow:0 3px 24px #1a386519}.composer textarea{border:0;outline:0;resize:none;background:none;min-height:45px;max-height:155px;padding:20px 20px 4px;font-size:14px;line-height:1.6;color:#20252d;width:100%;overflow-y:auto}.composer textarea::placeholder{color:#a3a9b2}.composer-bottom{display:flex;justify-content:space-between;align-items:center;padding:0 10px 9px 18px}.composer-hint{color:#9aa2ad;font-size:11px;display:flex;align-items:center;gap:5px}.sparkle{font-size:18px;color:#8198bf}.composer button{height:35px;width:35px;border-radius:12px;background:#283e61;border:0;display:grid;place-items:center;color:white}.composer button:hover{background:#172e53}.composer button:disabled{background:#c5cbd4;cursor:default}.composer button svg{height:20px;width:20px}.footnote{text-align:center;font-size:11px;color:#adb2ba;margin-top:14px;line-height:1.6}.load-error{font-size:13px;color:#b34f4f;margin-top:25px}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:930px){.sidebar{width:230px;min-width:230px}.welcome{padding:55px 20px 35px}}@media(max-width:700px){.sidebar{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(295px,85vw);min-width:0;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 28px #19243d14}.sidebar.open{transform:translateX(0)}.sidebar-close{display:grid}.mobile-overlay:not([hidden]){display:block;position:fixed;inset:0;background:#10182066;z-index:25}.menu-toggle{display:grid}.topbar{padding:0 15px;height:59px;min-height:59px}.header-title{font-size:15px}.header-beta{font-size:9px}.top-action span{display:none}.welcome{padding:clamp(30px,7vh,75px) 18px 30px}.welcome-logo{width:55px;height:55px;border-radius:18px;font-size:29px;margin-bottom:26px}.welcome p{font-size:13px}.welcome-divider{margin-top:39px}.suggestions{gap:8px}.suggestion{padding:14px;min-height:72px;font-size:12px}.message{padding:13px 15px}.message.user .bubble{max-width:90%}.composer-wrap{padding:9px 12px max(12px,env(safe-area-inset-bottom))}.composer{min-height:94px}.composer textarea{padding:16px 14px 0}.footnote{font-size:10px}.composer-bottom{padding:0 9px 7px 13px}}@media(max-width:380px){.suggestions{grid-template-columns:1fr}.welcome-divider{margin-top:25px}.suggestion{min-height:49px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

</style>
  
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="상담 메뉴">
      <div class="sidebar-top">
        <div class="school-brand"><span class="school-icon">D</span><span>DIMIGO <small>입학상담</small></span></div>
        <button class="sidebar-close icon-button" id="closeMenuBtn" type="button" aria-label="메뉴 닫기">✕</button>
      </div>
      <button class="new-chat" id="resetBtn" type="button"><span class="plus-icon">＋</span> 새 대화 시작 <span class="new-chat-arrow">↗</span></button>
      <div class="sidebar-section-title">빠른 질문</div>
      <div class="quick-links" id="sidebarSuggestions"></div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-info"><span class="status-dot"></span> 2027학년도 입학전형 안내 <span class="test-tag">시범 운영</span></div>
      <p class="sidebar-description">등록된 공식 자료에서 답변을 찾아 안내합니다. 확인되지 않은 사항은 담당자 상담을 권장합니다.</p>
      <div class="sidebar-footer"><span class="school-icon small">D</span><span>한국디지털미디어고등학교</span></div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay" hidden></div>
    <section class="main-panel">
      <header class="topbar">
        <div class="header-left"><button class="icon-button menu-toggle" id="menuBtn" type="button" aria-label="메뉴 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="header-title">디미고 입학상담 <span class="header-chevron">⌄</span></div><span class="header-beta">BETA</span></div>
        <button class="top-action" id="topResetBtn" type="button" title="새 대화 시작"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg><span>새 대화</span></button>
      </header>
      <main class="conversation" id="chat" aria-label="입학상담 대화" aria-live="polite" aria-relevant="additions text">
        <div class="welcome" id="emptyState">
          <div class="welcome-logo">D<span class="welcome-orbit"></span></div>
          <h1>무엇을 도와드릴까요?</h1>
          <p>2027학년도 디미고 입학전형에 대해 편하게 질문하세요.<br>확인된 안내 자료를 바탕으로 답변해 드립니다.</p>
          <div class="welcome-divider">이런 질문을 해보세요</div>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </main>
      <footer class="composer-wrap">
        <div class="composer-inner">
          <form class="composer" id="chatForm" autocomplete="off">
            <label class="sr-only" for="question">질문 입력</label>
            <textarea id="question" name="question" placeholder="입학전형에 대해 질문해 주세요" rows="1" maxlength="500" required></textarea>
            <div class="composer-bottom"><div class="composer-hint"><span class="sparkle">✧</span> 공식 FAQ 검색 · 생성형 AI 아님</div><button type="submit" id="sendBtn" aria-label="전송" title="전송"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button></div>
          </form>
          <div class="footnote">이름·연락처·수험번호·성적 등 개인정보를 입력하지 마세요. 답변보다 공식 공지사항이 우선합니다.</div>
        </div>
      </footer>
    </section>
  </div>
  <template id="userMessage"><div class="message user"><div class="message-inner"><div class="bubble"></div></div></div></template>
  <template id="botMessage"><div class="message assistant"><div class="message-inner"><div class="bot-heading"><span class="bot-avatar">D</span><span>디미고 입학상담</span></div><div class="bubble"></div><div class="source"></div><div class="actions"></div></div></div></template>
<script>
'use strict';
// Static, zero-API-cost FAQ retrieval. It does NOT send questions to any AI provider.
const $ = (id) => document.getElementById(id);
const state = {config:null,entries:[],busy:false};
// Conservative FAQ matcher: exact aliases first, then cautious similarity checks.
function canonical(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\u200b-\u200d\ufeff]/g,'').replace(/[^가-힣a-z0-9]/g,'');}
function bi(s){const x=canonical(s);const a=new Set();for(let i=0;i<x.length-1;i++)a.add(x.slice(i,i+2));return a;}
function similarity(a,b){const x=bi(a),y=bi(b);if(!x.size||!y.size)return 0;let k=0;for(const t of x)if(y.has(t))k++;return (2*k)/(x.size+y.size);}
function retrieve(query){
 const q=canonical(query);if(q.length<3)return null;
 const scored=[];
 for(const entry of state.entries){
  if(entry.status!=='published'||!entry.answer)continue;
  const phrases=[entry.question,...(entry.variants||[])];
  if(phrases.some(v=>canonical(v)===q))return {entry,score:1};
  const sim=Math.max(...phrases.map(v=>similarity(query,v)));
  // Short generic questions are particularly easy to misclassify: no fuzzy match.
  if(q.length<9)continue;
  if(sim>=0.76)scored.push({entry,score:sim});
 }
 scored.sort((a,b)=>b.score-a.score);
 if(!scored.length)return null;
 if(scored.length>1 && scored[0].score-scored[1].score<0.085)return null;
 return scored[0];
}
function safeLink(url){
  try{const u=new URL(url);return (u.protocol==='https:'||u.protocol==='http:')?u.href:null}catch{return null}
}
function message(role,text,source=null,fallback=false){
  const template=$(role==='user'?'userMessage':'botMessage');
  const element=template.content.firstElementChild.cloneNode(true);
  element.querySelector('.bubble').textContent=text;
  if(role==='assistant'){
    if(source){
      const el=element.querySelector('.source');el.append(document.createTextNode('출처: '+(source.sourceTitle||'공식 안내 자료')));
      const href=safeLink(source.sourceUrl);if(href){el.append(' · ');const link=document.createElement('a');link.href=href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='공지 원문 보기';el.append(link)}
    }
    if(fallback){
      const actions=element.querySelector('.actions');const url=safeLink(state.config.kakaoUrl);
      if(url){const a=document.createElement('a');a.className='action-link';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=state.config.kakaoLabel||'카카오톡 상담 연결';actions.append(a)}
      else{const p=document.createElement('span');p.className='action-disabled';p.textContent='카카오톡 상담 링크 등록 전입니다';actions.append(p)}
    }
  }
  $('chat').append(element);$('chat').scrollTop=$('chat').scrollHeight;
}
function submitQuestion(raw){
  const question=String(raw||'').trim().slice(0,500);if(!question||state.busy)return;
  state.busy=true;$('sendBtn').disabled=true;
  $('emptyState')?.remove();message('user',question);
  const result=retrieve(question);
  if(result){message('assistant',result.entry.answer,result.entry,false)}
  else{message('assistant',state.config.fallbackMessage,null,true)}
  $('question').value='';resize();state.busy=false;$('sendBtn').disabled=false;$('question').focus({preventScroll:true});
}
function resize(){const input=$('question');input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'}
function openMenu(){$('sidebar').classList.add('open');$('mobileOverlay').hidden=false}
function closeMenu(){$('sidebar').classList.remove('open');$('mobileOverlay').hidden=true}
async function init(){
  try{
    const [cfg,knowledge]=await Promise.all([
      fetch('./data/config.json',{cache:'no-store'}),fetch('./data/knowledge.json',{cache:'no-store'})
    ]);
    if(!cfg.ok||!knowledge.ok)throw new Error('자료 파일을 읽지 못했습니다.');
    state.config=await cfg.json();const kb=await knowledge.json();state.entries=Array.isArray(kb.entries)?kb.entries:[];
    const suggestions=$('suggestions'),sidebarSuggestions=$('sidebarSuggestions');
    for(const question of state.config.suggestedQuestions||[]){
      const button=document.createElement('button');button.type='button';button.className='suggestion';button.textContent=question;
      button.addEventListener('click',()=>submitQuestion(question));suggestions.append(button);
      const sideButton=document.createElement('button');sideButton.type='button';sideButton.className='quick-link';sideButton.textContent=question;
      sideButton.addEventListener('click',()=>{closeMenu();submitQuestion(question)});sidebarSuggestions.append(sideButton);
    }
    $('chatForm').addEventListener('submit',(event)=>{event.preventDefault();submitQuestion($('question').value)});
    $('question').addEventListener('input',resize);
    $('question').addEventListener('keydown',(event)=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();submitQuestion($('question').value)}});
    $('resetBtn').addEventListener('click',()=>location.reload());
    $('topResetBtn').addEventListener('click',()=>location.reload());
    $('menuBtn').addEventListener('click',openMenu);
    $('closeMenuBtn').addEventListener('click',closeMenu);
    $('mobileOverlay').addEventListener('click',closeMenu);
  }catch(error){
    $('chatForm').addEventListener('submit',e=>e.preventDefault());$('sendBtn').disabled=true;
    const p=document.createElement('p');p.textContent='자료를 불러오지 못했습니다. 관리자에게 문의해 주세요. (파일을 직접 열지 말고 웹 서버에서 실행해야 합니다.)';p.className='load-error';p.style.color='#b33';$('emptyState').append(p);
    console.error('초기화 실패:',error);
  }
}
init();

</script>
</body>
