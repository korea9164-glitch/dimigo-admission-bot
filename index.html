ctions:empty{display:none}.source a{color:#526f9c;text-decoration:none;border-bottom:1px solid #bfcde2}.actions{margin-top:15px;display:flex;flex-wrap:wrap}.action-link,.action-disabled{padding:11px 15px;border-radius:11px;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.action-link{color:#2b2611;background:#fee500}.action-link:before{content:"●";font-size:14px}.action-link:hover{background:#f3dc00}.action-disabled{color:#858e99;background:#f3f5f7}.composer-wrap{background:linear-gradient(0deg,#fff 88%,#ffffffeb);padding:12px 28px 18px}.composer-inner{max-width:780px;margin:auto}.composer{border:1px solid #e2e4e8;border-radius:22px;min-height:105px;box-shadow:0 3px 22px #232d3d0d;display:flex;flex-direction:column;background:white;transition:border .15s,box-shadow .15s}.composer:focus-within{border-color:#b7c4d6;box-shadow:0 3px 24px #1a386519}.composer textarea{border:0;outline:0;resize:none;background:none;min-height:45px;max-height:155px;padding:20px 20px 4px;font-size:14px;line-height:1.6;color:#20252d;width:100%;overflow-y:auto}.composer textarea::placeholder{color:#a3a9b2}.composer-bottom{display:flex;justify-content:space-between;align-items:center;padding:0 10px 9px 18px}.composer-hint{color:#9aa2ad;font-size:11px;display:flex;align-items:center;gap:5px}.sparkle{font-size:18px;color:#8198bf}.composer button{height:35px;width:35px;border-radius:12px;background:#283e61;border:0;display:grid;place-items:center;color:white}.composer button:hover{background:#172e53}.composer button:disabled{background:#c5cbd4;cursor:default}.composer button svg{height:20px;width:20px}.footnote{text-align:center;font-size:11px;color:#adb2ba;margin-top:14px;line-height:1.6}.load-error{font-size:13px;color:#b34f4f;margin-top:25px}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:930px){.sidebar{width:230px;min-width:230px}.w <script>
'use strict';
// Static, zero-API-cost FAQ retrieval. It does NOT send questions to any AI provider.
const $ = (id) => document.getElementById(id);
const state = {config:null,entries:[],busy:false};
// Conservative FAQ matcher: exact aliases first, then cautious similarity checks.
function canonical(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\u200b-\u200d\ufeff]/g,'').replace(/[^가-힣a-z0-9]/g,'');}
function bi(s){const x=canonical(s);const a=new Set();for(let i=0;i<x.length-1;i++)a.add(x.slice(i,i+2));return a;}
function similarity(a,b){const x=bi(a),y=bi(b);if(!x.size||!y.size)return 0;let k=0;for(const t of x)if(y.has(t))k++;return (2*k)/(x.size+y.size);}
function retrieve(query){
 const q=canonical(query);if(q.length<3)return null;
 const scored=[];
 for(const entry of state.entries){
  if(entry.status!=='published'||!entry.answer)continue;
  const phrases=[entry.question,...(entry.variants||[])];
  if(phrases.some(v=>canonical(v)===q))return {entry,score:1};
  const sim=Math.max(...phrases.map(v=>similarity(query,v)));
  // Short generic questions are particularly easy to misclassify: no fuzzy match.
  if(q.length<9)continue;
  if(sim>=0.76)scored.push({entry,score:sim});
 }
 scored.sort((a,b)=>b.score-a.score);
 if(!scored.length)return null;
 if(scored.length>1 && scored[0].score-scored[1].score<0.085)return null;
 return scored[0];
}
function safeLink(url){
  try{const u=new URL(url);return (u.protocol==='https:'||u.protocol==='http:')?u.href:null}catch{return null}
}
function message(role,text,source=null,fallback=false){
  const template=$(role==='user'?'userMessage':'botMessage');
  const element=template.content.firstElementChild.cloneNode(true);
  element.querySelector('.bubble').textContent=text;
  if(role==='assistant'){
    if(source){
      const el=element.querySelector('.source');el.append(document.createTextNode('출처: '+(source.sourceTitle||'공식 안내 자료')));
      const href=safeLink(source.sourceUrl);if(href){el.append(' · ');const link=document.createElement('a');link.href=href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='공지 원문 보기';el.append(link)}
    }
    if(fallback){
      const actions=element.querySelector('.actions');const url=safeLink(state.config.kakaoUrl);
      if(url){const a=document.createElement('a');a.className='action-link';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=state.config.kakaoLabel||'카카오톡 상담 연결';actions.append(a)}
      else{const p=document.createElement('span');p.className='action-disabled';p.textContent='카카오톡 상담 링크 등록 전입니다';actions.append(p)}
    }
  }
  $('chat').append(element);$('chat').scrollTop=$('chat').scrollHeight;
}
function submitQuestion(raw){
  const question=String(raw||'').trim().slice(0,500);if(!question||state.busy)return;
  state.busy=true;$('sendBtn').disabled=true;
  $('emptyState')?.remove();message('user',question);
  const result=retrieve(question);
  if(result){message('assistant',result.entry.answer,result.entry,false)}
  else{message('assistant',state.config.fallbackMessage,null,true)}
  $('question').value='';resize();state.busy=false;$('sendBtn').disabled=false;$('question').focus({preventScroll:true});
}
function resize(){const input=$('question');input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'}
function openMenu(){$('sidebar').classList.add('open');$('mobileOverlay').hidden=false}
function closeMenu(){$('sidebar').classList.remove('open');$('mobileOverlay').hidden=true}
async function init(){
  try{

    state.config={"schoolName":"한국디지털미디어고등학교","academicYear":"2027","kakaoUrl":"https://pf.kakao.com/_xmKrMn/chat","kakaoLabel":"카카오톡 1:1 입학상담","fallbackMessage":"질문에 딱 맞는 공식 안내를 안전하게 확인하지 못했습니다. 아래 카카오톡 입학상담에서 문의해 주세요. (이 챗봇은 생성형 AI가 아닌 공식 FAQ 검색 서비스입니다.)","suggestedQuestions":["일반전형 원서접수는 언제까지인가요?","서류는 어디에 업로드하나요?","일반전형 2단계 시험은 몇 시까지 입실해야 하나요?","중학교 정기시험과 디미고 2단계 전형이 겹치면 어떻게 하나요?"]};
    const kb={"version":"2027-verified-v3","updatedAt":"2026-11-10","description":"2027학년도 전형요항 PDF 및 열람 가능한 공식 학교 공지사항에 근거한 운영자 검토용 FAQ. 생성형 AI 아님.","entries":[{"id":"faq-001","status":"published","question":"넌 누구니?","variants":["너 누구야","챗봇 소개","어떤 봇이야","누구세요","안녕 챗봇"],"keywords":[],"answer":"안녕하세요. 저는 한국디지털미디어고등학교의 2027학년도 신입생 입학전형을 안내하는 FAQ 챗봇입니다. 공식 전형요항과 학교 공지사항에 근거해 답변하며, 개인별 전형 결과나 확인되지 않은 내용은 카카오톡 입학상담으로 안내합니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-002","status":"published","question":"어떤 학과를 모집하나요?","variants":["모집 학과 알려줘","디미고 학과 종류","학과가 몇 개야","학과별 정원"],"keywords":[],"answer":"2027학년도 모집학과는 e-비즈니스과, 디지털콘텐츠과, 웹프로그래밍과, 해킹방어과의 4개 학과입니다. 총 모집정원은 174명입니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-003","status":"published","question":"학과별 모집인원은 몇 명인가요?","variants":["모집정원은 어떻게 돼","각 과 몇 명 뽑아","학과 정원","일반전형 인원"],"keywords":[],"answer":"e-비즈니스과 29명(특별 8명·일반 21명), 디지털콘텐츠과 29명(특별 8명·일반 21명), 웹프로그래밍과 58명(특별 18명·일반 40명), 해킹방어과 58명(특별 18명·일반 40명)입니다. 정원 외 대상자는 별도 선발합니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-004","status":"published","question":"전국 어디서나 지원할 수 있나요?","variants":["타지역 지원 가능해","서울에서도 지원돼","전국 모집이야","지역 제한 있나요"],"keywords":[],"answer":"네. 2027학년도 한국디지털미디어고등학교는 전국단위로 모집합니다. 전형별 지원 자격은 별도로 확인해 주세요.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-005","status":"published","question":"전형료가 있나요?","variants":["지원비 얼마야","원서접수 비용","응시료 무료인가요"],"keywords":[],"answer":"아니요. 2027학년도 신입생 입학전형의 전형료는 없습니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-006","status":"published","question":"2지망을 쓸 수 있나요?","variants":["2지망도 지원 가능해","1지망 2지망 우선순위","두 학과 지원","2지망 선발 기준"],"keywords":[],"answer":"학과는 2지망까지 지원할 수 있으며 1지망 우선으로 배정합니다. 2지망 배정은 해당 학과 미달 시에만 이루어집니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-007","status":"published","question":"특별전형에는 어떤 부문이 있나요?","variants":["특별전형 종류","자기추천 창업특기 대회입상","특별전형 지원 자격"],"keywords":[],"answer":"진로적성(취업희망자) 특별전형은 대회입상·창업특기·자기추천 부문으로 구성됩니다. 각 부문별 지원 자격과 제출자료는 전형요항 및 제출서류 안내를 확인해 주세요.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-008","status":"published","question":"일반전형은 어떤 방식으로 선발하나요?","variants":["일반전형 점수 배점","일반전형 1차 2차","일반전형 200점","1단계 2배수"],"keywords":[],"answer":"총점은 200점이며 1단계는 교과점수 120점과 학교생활기록부 종합평가 20점으로 학과별 정원의 2배수를 선발합니다(동점자는 모두 선발). 2단계 소질·적성검사 40점과 일반면접 20점을 합산해 최종 합격자를 선정합니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-009","status":"published","question":"특별전형은 어떻게 점수를 산정하나요?","variants":["특별전형 배점","특별전형 면접 몇 점","특별전형 총점"],"keywords":[],"answer":"총 200점으로 교과 60점, 학교생활기록부 종합평가 20점, 활동증빙자료 60점, 자기소개서 20점, 심층면접 40점입니다. 1단계 합산점수로 정원의 2배수를 선발하고, 2단계 면접 점수를 합산해 최종 선발합니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-010","status":"published","question":"특별전형에 떨어지면 일반전형에 다시 지원할 수 있나요?","variants":["특별전형 불합격 일반전형","특별 떨어지면 일반 가능","특별전형 탈락 재지원"],"keywords":[],"answer":"네. 진로적성특별전형에서 선발되지 않은 학생은 일반전형에 재지원할 수 있습니다. 원서를 다시 접수해야 하며, 입학관리시스템에서는 불합격 결과 페이지의 ‘재지원하기’ 탭을 이용하라는 별도 안내가 있습니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-011","status":"published","question":"일반전형 교과는 어떤 과목을 반영하나요?","variants":["내신 반영 과목","사회 과학도 반영하나요","영어 수학 국어 점수","교과 반영 학기"],"keywords":[],"answer":"2027학년도 교과점수 반영 과목은 국어·수학·영어입니다. 반영 범위는 1학년 2학기부터 3학년 2학기까지이며, 3학년 2학기는 10월 31일 이전 실제 실시한 평가를 기준으로 합니다. 2028학년도부터는 별도 변경 예고가 있으므로 혼동하지 않도록 주의해 주세요.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-012","status":"published","question":"미인정 결석이나 지각은 몇 점 감점되나요?","variants":["미인정 지각 감점","무단결석 점수","출결 점수","결석 몇 점"],"keywords":[],"answer":"2027학년도 출결 평가(6점)에서 미인정 결석은 1회당 1점씩 최대 6점 감점되고, 미인정 지각·조퇴·결과는 매회 0.5점씩 감점됩니다. 질병 결석과 출석인정결석 등은 해당 미인정 결석 횟수에 포함하지 않습니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-013","status":"published","question":"독서활동 점수는 어떻게 계산하나요?","variants":["독서 몇 권 만점","독서활동 20권","책 한권 점수"],"keywords":[],"answer":"2027학년도 독서활동은 6점 만점입니다. 0권이면 2점이고, 학교생활기록부 독서활동 상황에 기재된 도서 1권당 0.2점씩 가산해 20권 이상이면 6점입니다. 학년당 최대 10권까지 인정됩니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-014","status":"published","question":"봉사활동 점수는 어떻게 반영하나요?","variants":["봉사 15시간","봉사시간 반영","봉사활동 몇 점"],"keywords":[],"answer":"2027학년도 봉사활동은 2점 만점으로, 0시간 0.5점에서 시작해 매 시간 0.1점씩 가산하고 15시간 이상이면 2점입니다. 2028학년도부터 미반영한다는 별도의 사전예고가 있으므로 2027학년도와 구별해 주세요.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-015","status":"published","question":"교내 수상실적은 어떻게 반영하나요?","variants":["교내상 점수","상장 몇 개 만점","상장 인정기준"],"keywords":[],"answer":"2027학년도 교내 수상실적은 3점 만점으로, 0회 1.5점부터 인정 수상 1회당 0.3점씩 가산해 5회 이상 3점입니다. 한 학기당 1개만 인정하며 교과성적 관련 상, 출결 관련 상, 4인 이상 단체수상 등은 제외합니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-016","status":"published","question":"학생회장이나 반장 활동도 점수에 반영되나요?","variants":["임원활동 점수","반장 점수","학생회 점수"],"keywords":[],"answer":"네. 2027학년도 자치회 임원활동은 최대 3점입니다. 전교·학년 학생회장·부회장, 학급회장·부회장을 대상으로 0회 2.1점, 1회 2.4점, 2회 2.7점, 3회 이상 3점이며 같은 학기 중복 활동은 1개만 반영합니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-017","status":"published","question":"검정고시로 지원할 수 있나요?","variants":["검정고시 지원 가능","검정고시 일반전형","중졸 검정고시"],"keywords":[],"answer":"중학교 졸업과 동등 이상의 학력이 인정되면 지원 자격에 해당할 수 있습니다. 검정고시자의 일반전형 1단계 점수는 경기도교육청 2027학년도 고입 내신성적반영지침을 준용해 전과목(선택과목 제외)을 반영하여 총 140점 만점으로 산출합니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-018","status":"published","question":"검정고시 점수는 어디서 계산하나요?","variants":["검정고시 내신 산출","검정고시 환산","검정고시 성적 계산"],"keywords":[],"answer":"검정고시 지원자는 경기도교육청 고등학교 입학·전학 포털의 ‘2027학년도 경기도 고입내신산출 참고자료(검정고시용)’을 확인해 산출해야 합니다. 개별 점수의 확정이나 합격 가능성 판단은 챗봇이 하지 않습니다.","sourceTitle":"검정고시자 고입내신 산출 참고자료","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1531133"},{"id":"faq-019","status":"published","question":"특례입학은 어떻게 선발하나요?","variants":["특례 60점","특례전형 배점","특례입학 지원"],"keywords":[],"answer":"특례입학대상자는 관련 법령과 전형요항에 따라 원칙적으로 정원 외로 선발하며, 소질·적성검사 40점과 면접 20점의 합계 60점으로 평가합니다. 일부 법령상 유형은 정원 내 선발에 해당하므로 개별 자격과 서류는 담당자에게 확인해 주세요.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-020","status":"published","question":"국가유공자 자녀는 어떻게 선발하나요?","variants":["국가유공자 정원 외","유공자 전형","교육지원대상자"],"keywords":[],"answer":"국가유공자 자녀(교육지원대상자)는 입학정원의 3% 범위 내에서 일반전형 점수 산정 기준을 적용해 정원 외로 선발합니다. 전형요항상 학과별 선발 상한도 있으므로 상세 내용은 공식 요항을 확인해 주세요.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-021","status":"published","question":"합격 후 다른 학교에 지원할 수 있나요?","variants":["이중지원 가능","합격 후 후기학교","등록 포기 다른 학교"],"keywords":[],"answer":"전형요항에는 전기학교 이중지원 금지 및 합격자(등록포기·입학포기자 포함)의 전기학교 추가모집·후기학교 지원 제한이 명시되어 있습니다. 개별 사례는 관련 입학전형 규정에 따라 확인해야 하므로 카카오톡으로 문의해 주세요.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-022","status":"published","question":"면접에 응시하지 않으면 어떻게 되나요?","variants":["면접 결시","적성검사 안 보면","2차 시험 불참"],"keywords":[],"answer":"전형요항에 따르면 2단계 전형 대상자가 면접에 응시하지 않은 경우 불합격 처리됩니다. 일반전형 소질·적성검사에 응시하지 않은 경우도 불합격 처리됩니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"},{"id":"faq-023","status":"published","question":"일반전형 원서접수는 언제까지인가요?","variants":["일반전형 접수기간","일반 원서 마감","일반전형 11월 9일","원서 언제까지","일반전형 언제까지","일반전형 언제까지 접수해","일반전형 접수 언제까지","일반전형 접수마감 언제야"],"keywords":[],"answer":"최신 학교 공지에서는 2027학년도 일반전형 원서접수 및 서류 제출 기한을 2026년 11월 13일(금) 17:00까지로 안내합니다. 원서 작성은 11월 9일(월)부터 시작합니다. 전형요항 표에는 11월 12~13일로 기재되어 있어 시작일 표기가 다르므로, 실제 시스템 운영 기간은 최신 학교 공지를 확인해 주세요.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-024","status":"published","question":"서류는 어디에 업로드하나요?","variants":["서류 제출 방법","증빙서류 어디 올려","원서 제출 후 파일 첨부","서류 업로드 위치"],"keywords":[],"answer":"입학관리시스템에서 원서를 작성한 뒤 ‘원서 마감 및 출력’ 단계에서 마감하고 다음 단계로 이동하면 서류 제출 화면이 나타납니다. 해당 항목에 맞게 필요한 PDF 등을 업로드하여 제출하세요.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-025","status":"published","question":"원서 마감 후 학과나 지망을 바꿀 수 있나요?","variants":["학과 바꾸기","1지망 수정","지원학과 변경","지망 변경 가능"],"keywords":[],"answer":"아니요. 공식 공지에 따르면 ‘원서 마감 및 출력’ 단계에서 마감한 이후에는 학과 및 지망 변경이 불가능합니다. 마감 전 지원 학과와 지망을 반드시 확인해 주세요.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-026","status":"published","question":"원서 마감 후 성적 입력 오류를 수정할 수 있나요?","variants":["원서 오류 수정","성적 잘못 입력","마감 후 수정","원서 잘못 썼어"],"keywords":[],"answer":"원서 마감 뒤에는 지원자가 시스템에서 직접 수정할 수 없습니다. 성적 등의 부득이한 입력 오류가 있다면 원서 출력본에 수기로 수정 사항을 표시해 스캔·업로드하고, 원서 및 서류 제출을 완료한 뒤 카카오톡 채널로 수정 전후 내용을 알려야 합니다. 제출 증빙과 대조해 학교가 수정 가능 여부를 판단합니다. 학과·지망 변경은 불가합니다.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-027","status":"published","question":"사진을 바꿨는데 그대로 보여요.","variants":["사진 변경 안됨","증명사진 수정 안돼","업로드 사진 그대로","사진 업데이트"],"keywords":[],"answer":"사진을 새로 올려도 화면에 즉시 변경되지 않은 것처럼 보일 수 있습니다. 다음 단계로 이동했다가 이전 단계로 돌아와 변경된 사진을 확인해 주세요.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-028","status":"published","question":"학교 전화번호를 수정할 수 없어요.","variants":["학교번호 수정","학교 전화번호 수정","담임선생님 전화번호","나이스 코드 번호"],"keywords":[],"answer":"입학관리시스템의 학교 전화번호는 학교 NEIS 코드를 기반으로 자동 입력되므로 별도 수정이 불가능합니다. 자동 입력된 번호를 그대로 두고 다음 단계로 진행하세요.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-029","status":"published","question":"수험표는 언제 어디서 출력하나요?","variants":["수험표 출력 위치","수험표 발급","수험표 직인","원서 접수하자마자 수험표"],"keywords":[],"answer":"2027학년도에는 1단계 합격자 발표 이후 2단계 전형 대상자만 입학관리시스템에서 수험표를 출력할 수 있습니다. 수험표에 학교장 직인을 별도로 날인하지 않아도 됩니다.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-030","status":"published","question":"접수 여부는 어떻게 확인하나요?","variants":["원서 접수됐나요","수험번호 확인","접수확인 안돼","접수 결과 조회"],"keywords":[],"answer":"일반전형 접수 여부는 원서접수 마감 후(2026년 11월 13일 17:00 이후) 학교 홈페이지 공지에 게시하는 수험번호를 대조해 확인하도록 안내되어 있습니다. 지원자 개인정보 보호를 위해 전화로 개별 접수 여부를 안내하지 않는다고 공지되어 있습니다.","sourceTitle":"일반전형 원서접수 및 입학관리시스템 FAQ","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536010"},{"id":"faq-031","status":"published","question":"일반전형 2단계 전형일 출결은 어떻게 처리하나요?","variants":["면접 공결 처리","2차 시험 출석 인정","출결 협조 공문","학교 빠져도 돼"],"keywords":[],"answer":"일반전형 2단계 전형 대상자로 선정된 뒤, 학교 공지에 첨부된 ‘출결처리 협조 공문’과 입학관리시스템의 ‘1단계 합격 결과 화면’을 함께 출력해 재학 중인 중학교에 제출하세요. 공문만 단독 제출하면 개별 합격을 증명할 수 없습니다. 최종 출결처리는 재학 중학교 규정과 절차를 따릅니다.","sourceTitle":"일반전형 2단계 출결처리 협조 공문 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1537418"},{"id":"faq-032","status":"published","question":"중학교 정기시험과 디미고 2단계 전형이 겹치면 어떻게 하나요?","variants":["월요일에 중학교 시험","중간고사 면접 겹침","기말고사 2차 겹침","정기시험 인정점"],"keywords":[],"answer":"2026년 11월 16일(월) 중학교 정기시험과 디미고 일반전형 2단계 전형이 겹치는 경우, 학생과 보호자가 어느 시험에 응시할지 결정해야 합니다. 중학교 시험 결시에 대한 출석인정결석·인정점 처리 여부는 재학 중학교의 학업성적관리규정에 따르므로 담임·성적 담당 선생님과 미리 확인해 주세요.","sourceTitle":"일반전형 2단계 출결처리 협조 공문 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1537418"},{"id":"faq-033","status":"published","question":"일반전형 2단계 시험은 몇 시까지 입실해야 하나요?","variants":["2차 입실 마감","면접 몇 시 도착","14시 늦으면","일반전형 지각"],"keywords":[],"answer":"2026년 11월 16일(월) 일반전형 2단계는 14:00 소질·적성검사, 15:00 일반면접 순으로 진행됩니다. 반드시 14:00까지 지정 고사실에 입실해야 하며, 14:00 이후에는 사유와 무관하게 입실할 수 없다고 공지되어 있습니다.","sourceTitle":"일반전형 2단계 출결처리 협조 공문 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1537418"},{"id":"faq-034","status":"published","question":"출결 협조 공문은 언제 출력하나요?","variants":["공문 미리 제출","출결 공문 출력 시기","합격 화면 제출"],"keywords":[],"answer":"공문은 사전에 게시되어 있지만, 실제 출력 및 재학 중학교 제출은 일반전형 2단계 대상자 발표 이후에 진행해야 합니다. 협조 공문과 1단계 합격 결과 화면을 함께 제출하세요.","sourceTitle":"일반전형 2단계 출결처리 협조 공문 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1537418"},{"id":"faq-035","status":"published","question":"특별전형과 일반전형 면접 방식은 어떻게 다른가요?","variants":["일반면접 몇 명씩","심층면접 1대1","면접 시간","면접 진행 방식"],"keywords":[],"answer":"학교 면접 안내에 따르면 특별전형 심층면접은 학생 1명과 면접위원 2~3명이 약 10분(±2분) 동안 진행하고, 일반전형 일반면접은 학생 3명과 면접위원 2~3명이 한 조로 약 13분(±2분) 동안 진행합니다. 실제 전형 안내를 우선 확인하세요.","sourceTitle":"일반면접과 심층면접 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1525010"},{"id":"faq-036","status":"published","question":"면접에서 학교생활기록부 내용을 평가하나요?","variants":["학생부 질문 나오나요","생기부 면접 평가","학교생활기록부 면접"],"keywords":[],"answer":"학교 공지에 따르면 학교생활기록부는 학생을 이해하는 참고자료로 활용될 수 있지만, 학생부에 적힌 특정 활동 자체를 면접에서 평가하는 방식은 아닙니다. 각 전형에서 공지한 평가요소와 본인이 제출한 자료를 중심으로 준비하세요.","sourceTitle":"일반면접과 심층면접 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1525010"},{"id":"faq-037","status":"published","question":"소질·적성검사는 어떤 시험인가요?","variants":["소질적성 시험 내용","적성검사 50분","IT 시험 문제","소질 적성검사란"],"keywords":[],"answer":"일반전형 소질·적성검사는 IT 기초 이해, 문제해결, 논리적 사고, 독해·정보이해, 수리추론, 창의융합적 사고 등을 평가하는 50분, 40점의 시험입니다. 중학교 정보 교과와 다른 교과가 융합된 문항도 출제될 수 있습니다.","sourceTitle":"일반전형 소질·적성검사 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1523628"},{"id":"faq-038","status":"published","question":"소질·적성검사 기출문제는 어디서 볼 수 있나요?","variants":["적성검사 기출","기출문제 다운로드","적성시험 예시문제"],"keywords":[],"answer":"학교 입학공지사항의 ‘일반전형 소질·적성검사란 무엇인가요? (기출문제 공개)’ 게시글에서 예시 및 기출문항을 확인할 수 있습니다.","sourceTitle":"일반전형 소질·적성검사 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1523628"},{"id":"faq-039","status":"published","question":"자기추천이나 창업특기 실적설명서는 몇 개 제출하나요?","variants":["실적 설명 2개","보조영상 몇 분","활동실적 몇 건","자기추천 실적"],"keywords":[],"answer":"창업특기·자기추천 지원자는 중학교 재학 중 수상하거나 활동한 대표 실적 1건에 대한 실적설명서와 3분 이내 보조 영상을 제출해야 합니다. 여러 실적을 묶어 제출하는 것은 허용되지 않습니다.","sourceTitle":"특별전형 제출서류 및 실적 작성 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1524153"},{"id":"faq-040","status":"published","question":"대회입상 부문도 실적설명서를 내나요?","variants":["대회입상 실적설명","대회 상장 사본","대회입상 증빙"],"keywords":[],"answer":"아니요. 대회입상 부문은 별도 실적설명서 대신 지원 자격에 맞는 상장 사본 또는 수상증빙공문을 제출합니다. 특별전형 공통 제출서류인 자기소개서, 취업(창업)계획서 및 교사추천서 등도 준비해야 합니다.","sourceTitle":"특별전형 제출서류 및 실적 작성 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1524153"},{"id":"faq-041","status":"published","question":"한국코드페어 상으로 대회입상 지원이 가능한가요?","variants":["코드페어 대회입상","한국코드페어 특별전형","코드페어 상장"],"keywords":[],"answer":"학교의 2027학년도 특별전형 제출서류 안내에 따르면 한국코드페어 수상실적은 대회입상 부문 대상에서 제외되었으며, 자기추천 부문으로 지원할 수 있다고 안내되어 있습니다.","sourceTitle":"특별전형 제출서류 및 실적 작성 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1524153"},{"id":"faq-042","status":"published","question":"학교생활기록부Ⅱ에 원본대조필이 필요한가요?","variants":["학생부 원본대조필","나이스 PDF 바로 저장","생활기록부 스캔"],"keywords":[],"answer":"교사 NEIS에서 PDF로 직접 저장한 학교생활기록부Ⅱ는 원본대조필 없이 제출할 수 있습니다. 종이로 출력한 경우에는 원본대조필을 한 뒤 PDF로 스캔해 업로드해야 합니다.","sourceTitle":"학교생활기록부Ⅱ PDF 저장방법","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1532144"},{"id":"faq-043","status":"published","question":"학교생활기록부Ⅱ를 출력할 때 무엇을 체크하나요?","variants":["상급학교 제출용 체크","교내상 출력 방법","나이스 생기부 출력"],"keywords":[],"answer":"NEIS에서 학생부Ⅱ와 단면출력만 체크하고, ‘상급학교 제출용’ 등 다른 출력 옵션은 체크하지 말라고 안내하고 있습니다. 교내 수상기록이 누락되지 않도록 확인해야 합니다.","sourceTitle":"학교생활기록부Ⅱ PDF 저장방법","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1532144"},{"id":"faq-044","status":"published","question":"학교생활기록부 출결 마감 기준일은 언제인가요?","variants":["출결 마감일","생기부 기준일","10월 31일 학생부"],"keywords":[],"answer":"2027학년도 입학전형용 학교생활기록부 출결 마감 기준일은 2026년 10월 31일입니다. 출결 특기사항란에 해당 기준일을 기입하도록 안내되어 있습니다.","sourceTitle":"학교생활기록부Ⅱ PDF 저장방법","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1532144"},{"id":"faq-045","status":"published","question":"3학년 세특과 행동특성 의견이 비어 있어도 되나요?","variants":["3학년 세특 공란","행특 비어있어도","학생부 기재 미완료"],"keywords":[],"answer":"학교의 학생부Ⅱ 제출 안내에 따르면 3학년 과목별 세부능력 및 특기사항과 행동특성 및 종합의견은 공란이어도 됩니다. 다만 다른 제출 필수 요소는 별도로 확인해야 합니다.","sourceTitle":"학교생활기록부Ⅱ PDF 저장방법","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1532144"},{"id":"faq-046","status":"published","question":"자유학기라 특정 학기 성적이 없으면 어떻게 하나요?","variants":["자유학기 성적 없어요","1학년 2학기 성적 공백","자유학년제 내신"],"keywords":[],"answer":"공식 FAQ에 따르면 자유학기 등으로 특정 학기 성적이 없는 경우 경기도교육청 고입 내신성적 반영지침에 따라 대체합니다. 예컨대 한 학기의 성적만 없으면 해당 학년의 다른 학기 성적으로 대체하며, 두 학기 모두 없으면 차상위 학년 성적을 기준으로 처리합니다. 세부 사례는 원문 지침을 확인하세요.","sourceTitle":"내신성적 산출 관련 자주 묻는 질문","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1524004"},{"id":"faq-047","status":"published","question":"3학년 2학기 시험이 10월 31일 이후라면 성적을 어떻게 내나요?","variants":["지필고사 11월","3학년 2학기 성적 산출","10월 31일 이후 시험","수행평가만 실시"],"keywords":[],"answer":"10월 31일까지 실제 실시한 지필·수행평가를 100% 기준으로 환산해 성적을 산출합니다. 그 이후 실시 예정인 시험 점수를 예상하여 입력하지 않습니다. 타 시·도 중학교는 별도 수기 성적통지표가 필요할 수 있습니다.","sourceTitle":"내신성적 산출 관련 자주 묻는 질문","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1524004"},{"id":"faq-048","status":"published","question":"타 시·도 중학교는 3학년 2학기 성적통지표를 제출하나요?","variants":["타시도 성적표","수기 성적통지표","3학년 2학기 성적 제출"],"keywords":[],"answer":"경기도 외 타 시·도 중학교 중 3학년 2학기 성적이 학교생활기록부에 기록되지 않은 경우, 본교가 제공한 2027학년도 수기 성적통지표 엑셀 양식을 작성하고 학교장 직인을 날인하여 스캔 후 제출하도록 안내되어 있습니다.","sourceTitle":"특별전형 제출서류 및 실적 작성 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1524153"},{"id":"faq-049","status":"published","question":"특별전형 1단계 합격 여부는 어디서 확인하나요?","variants":["특별전형 1차 결과","심층면접 대상자 조회","특별전형 합격자 발표"],"keywords":[],"answer":"입학관리시스템 메인 화면 ‘접수확인 및 전형결과’ 메뉴에서 확인합니다. 특별전형 1단계 합격자는 합격 결과 페이지 아래에서 수험표를 출력할 수 있습니다.","sourceTitle":"특별전형 1단계 결과 및 2단계 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1537118"},{"id":"faq-050","status":"published","question":"특별전형 2단계 심층면접은 언제였나요?","variants":["특별전형 면접 일자","11월 7일 심층면접","특별 면접 시간"],"keywords":[],"answer":"2027학년도 진로적성특별전형 2단계 심층면접은 2026년 11월 7일(토)에 진행되도록 공지되었으며, 수험표에 기재된 개인별 시간대에 응시하도록 안내되었습니다.","sourceTitle":"특별전형 1단계 결과 및 2단계 안내","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1537118"},{"id":"faq-051","status":"published","question":"특별전형 경쟁률은 얼마였나요?","variants":["특별 경쟁률","264명 지원","학과별 경쟁률"],"keywords":[],"answer":"학교의 2026년 11월 5일 모집 마감 공지에 따르면 2027학년도 진로적성특별전형은 모집인원 52명에 264명이 지원하여 약 5.1:1의 경쟁률을 기록했습니다. 학과별 경쟁률은 별도로 공개하지 않았습니다. 단, 해당 공지 본문 일부에는 ‘2026학년도’ 표기가 혼재되어 있으므로 학년도 표시의 원문 오기를 운영자가 확인할 필요가 있습니다.","sourceTitle":"특별전형 모집 마감 및 접수 확인","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/na/ntt/selectNttInfo.do?mi=13631&bbsId=6915&nttSn=1536954"},{"id":"faq-052","status":"published","question":"2028학년도와 2029학년도 변경 예고도 2027학년도에 적용되나요?","variants":["2028 변경사항","2029 변경","사회 과학 반영 시기","봉사활동 미반영 언제"],"keywords":[],"answer":"아니요. 전형요항 뒤의 ‘2028학년도 주요 변경사항’과 ‘2029학년도 주요 변경사항’은 사전예고입니다. 2027학년도 지원에는 2027학년도 본문 기준을 적용하며, 이후 학년도 변경 예고를 혼동해서는 안 됩니다.","sourceTitle":"2027학년도 신입생 입학전형요항","sourceUrl":"https://dimigo-h.goeas.kr/dimigo-h/cm/cntnts/cntntsView.do?cntntsId=1889&mi=13632"}]};
    state.entries=Array.isArray(kb.entries)?kb.entries:[];
    const suggestions=$('suggestions'),sidebarSuggestions=$('sidebarSuggestions');
    for(const question of state.config.suggestedQuestions||[]){
      const button=document.createElement('button');button.type='button';button.className='suggestion';button.textContent=question;
      button.addEventListener('click',()=>submitQuestion(question));suggestions.append(button);

    $('chatForm').addEventListener('submit',(event)=>{event.preventDefault();submitQuestion($('question').value)});

    $('question').addEventListener('keydown',(event)=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();submitQuestion($('question').value)}});
    $('resetBtn').addEventListener('click',()=>location.reload());
